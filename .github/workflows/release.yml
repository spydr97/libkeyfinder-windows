name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      # Activate MSVC (whatever VS version the runner has) so Ninja finds cl.exe.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (vcpkg manifest, static triplet)
        shell: pwsh
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\kfcli.exe dist\keyfinder.exe

      - uses: actions/upload-artifact@v4
        with:
          name: keyfinder-windows-x64
          path: dist/keyfinder.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keyfinder.exe
          generate_release_notes: true
